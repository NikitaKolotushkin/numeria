resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/ssl/fake-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/fake-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    location / {
        include conf.d/proxy_params;
        set $upstream_frontend numeria_frontend:80;
        proxy_pass http://$upstream_frontend;
    }

    location /api/users/ {
        include conf.d/proxy_params;
        set $upstream_users numeria_users:8000;
        proxy_pass http://$upstream_users/;
    }

    location /api/study/ {
        include conf.d/proxy_params;
        set $upstream_study numeria_study:8000;
        proxy_pass http://$upstream_study/;
    }

    location /api/game/ {
        include conf.d/proxy_params;
        set $upstream_game numeria_game:8000;
        proxy_pass http://$upstream_game/;
    }

    location /api/crisis/ {
        include conf.d/proxy_params;
        set $upstream_crisis numeria_crisis_engine:8000;
        proxy_pass http://$upstream_crisis/;
    }

    location /api/career/ {
        include conf.d/proxy_params;
        set $upstream_career numeria_career:8000;
        proxy_pass http://$upstream_career/;
    }

    location /api/ai/ {
        include conf.d/proxy_params;
        set $upstream_ai numeria_ai:8000;
        proxy_pass http://$upstream_ai/;
    }

    location /api/notifications/ {
        include conf.d/proxy_params;
        set $upstream_notifications numeria_notifications:8000;
        proxy_pass http://$upstream_notifications/;
    }
}

server {
    listen 80;
    server_name numeria-game.ru www.numeria-game.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name numeria-game.ru www.numeria-game.ru;

    ssl_certificate /etc/nginx/ssl/numeria-game.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/numeria-game.ru/certificate.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        include conf.d/proxy_params;
        set $upstream_frontend numeria_frontend:80;
        proxy_pass http://$upstream_frontend;
    }


    location /api/users/ {
        include conf.d/proxy_params;
        set $upstream_users numeria_users:8000;
        proxy_pass http://$upstream_users/;
    }

    location /api/study/ {
        include conf.d/proxy_params;
        set $upstream_study numeria_study:8000;
        proxy_pass http://$upstream_study/;
    }

    location /api/game/ {
        include conf.d/proxy_params;
        set $upstream_game numeria_game:8000;
        proxy_pass http://$upstream_game/;
    }

    location /api/crisis/ {
        include conf.d/proxy_params;
        set $upstream_crisis numeria_crisis_engine:8000;
        proxy_pass http://$upstream_crisis/;
    }

    location /api/career/ {
        include conf.d/proxy_params;
        set $upstream_career numeria_career:8000;
        proxy_pass http://$upstream_career/;
    }

    location /api/ai/ {
        include conf.d/proxy_params;
        set $upstream_ai numeria_ai:8000;
        proxy_pass http://$upstream_ai/;
    }

    location /api/notifications/ {
        include conf.d/proxy_params;
        set $upstream_notifications numeria_notifications:8000;
        proxy_pass http://$upstream_notifications/;
    }
}