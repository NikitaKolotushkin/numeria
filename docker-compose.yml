version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-microservice-def: &microservice-def
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - numeria_network
  logging: *default-logging
  depends_on:
    pgbouncer:
      condition: service_started
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    container_name: numeria_postgres
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - numeria_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: numeria_pgbouncer
    restart: always
    env_file:
      - .env
    volumes:
      - ./infrastructure/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    networks:
      - numeria_network
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: numeria_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - numeria_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$$REDIS_PASSWORD' ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  kafka:
    image: apache/kafka:latest
    container_name: numeria_kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - numeria_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  minio:
    image: minio/minio:latest
    container_name: numeria_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - numeria_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  users:
    <<: *microservice-def
    container_name: numeria_users
    build:
      context: .
      dockerfile: services/users/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  study:
    <<: *microservice-def
    container_name: numeria_study
    build:
      context: .
      dockerfile: services/study/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  game:
    <<: *microservice-def
    container_name: numeria_game
    build:
      context: .
      dockerfile: services/game/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  crisis-engine:
    <<: *microservice-def
    container_name: numeria_crisis_engine
    build:
      context: .
      dockerfile: services/crisis-engine/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  career:
    <<: *microservice-def
    container_name: numeria_career
    build:
      context: .
      dockerfile: services/career/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  ai:
    <<: *microservice-def
    container_name: numeria_ai
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  notifications:
    <<: *microservice-def
    container_name: numeria_notifications
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    container_name: numeria_frontend
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - numeria_network
    logging: *default-logging

  nginx:
    image: nginx:alpine
    container_name: numeria_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - numeria_network
    depends_on:
      - users
      - study
      - game
      - crisis-engine
      - career
      - ai
      - notifications
      - frontend

networks:
  numeria_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data: